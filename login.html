<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Massa - Acesso Restrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-dark d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card card-bella p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <i class="fas fa-pizza-slice text-primary fa-3x mb-2"></i>
                        <h2 class="text-primary">Bella Massa</h2>
                        <p class="text-muted small">Acesso Restrito a Funcionários</p>
                    </div>
                    <div id="alert-erro" class="alert alert-danger d-none" role="alert"></div>
                    <form id="form-login">
                        <div class="mb-3">
                            <label for="email" class="form-label font-weight-bold">E-mail</label>
                            <input type="email" class="form-control" id="email" required placeholder="funcionario@bellamassa.com">
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label font-weight-bold">Senha</label>
                            <input type="password" class="form-control" id="senha" required placeholder="******">
                        </div>
                        <button type="submit" class="btn btn-primary btn-bella w-100 mt-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Entrar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/login.js"></script>
</body>
</html>
